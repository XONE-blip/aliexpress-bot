name: Telegram search bot

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tg-search
  cancel-in-progress: false

jobs:
  reply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install python-aliexpress-api requests

      - name: Run search bot
        env:
          APP_SECRET: ${{ secrets.APP_SECRET }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python tg_search_bot.py

      - name: Save offset
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add tg_offset.json || true
          git diff --cached --quiet || (git commit -m "update offset" && git pull --rebase && git push)
