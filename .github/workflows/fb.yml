name: Post to Facebook

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: post-fb
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install python-aliexpress-api requests

      - name: Run Facebook bot
        env:
          APP_SECRET: ${{ secrets.APP_SECRET }}
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: python fb_bot.py

      - name: Save seen_fb.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add seen_fb.json || true
          git diff --cached --quiet || (git commit -m "update seen_fb" && git pull --rebase && git push)
